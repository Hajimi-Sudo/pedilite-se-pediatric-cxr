[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pedilite-se"
version = "0.1.0"
description = "Parameter-efficient attention CNN experiments for pediatric chest radiograph classification"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
